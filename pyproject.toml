[project]
name = "france-load-forecasting"
version = "0.1.0"
description = "Day-ahead forecasting of French electricity consumption, benchmarked against RTE's own J-1 forecast."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Julien Beloin" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "catboost>=1.2.7",
    "holidays>=0.60",
    "requests>=2.32",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[project.scripts]
flf = "load_forecast.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/load_forecast"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
